[package]
name = "partition-lab"
version = "0.1.0"
description = "An interactive model of network partitions: CRDT merging vs. majority writes and locks."
license = "MIT"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "=0.2.130"

[dev-dependencies]
proptest = "1"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
